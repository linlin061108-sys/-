<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【位面系統009】高維觀測終端</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <!-- 液態玻璃光學折射濾鏡 -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <defs>
            <filter id="liquid-refract" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.015 0.025" numOctaves="2" seed="9" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <!-- ================= 階段一：虹膜掃描啟動遮罩 ================= -->
    <div id="boot-screen" class="boot-overlay">
        <div class="boot-glass-panel">
            <div class="boot-code">SYSTEM_ID // 009-OMEGA</div>
            
            <div class="iris-scanner">
                <svg viewBox="0 0 200 200" class="iris-svg">
                    <circle cx="100" cy="100" r="88" class="iris-ring-outer" />
                    <circle cx="100" cy="100" r="68" class="iris-ring-mid" />
                    <circle cx="100" cy="100" r="46" class="iris-ring-inner" />
                    <circle cx="100" cy="100" r="18" class="iris-pupil" />
                    <line x1="100" y1="4" x2="100" y2="22" class="iris-cross" />
                    <line x1="100" y1="178" x2="100" y2="196" class="iris-cross" />
                    <line x1="4" y1="100" x2="22" y2="100" class="iris-cross" />
                    <line x1="178" y1="100" x2="196" y2="100" class="iris-cross" />
                </svg>
                <div class="scan-laser"></div>
            </div>

            <div class="boot-status-box">
                <p id="boot-sub-text" class="boot-sub">正在擷取靈魂波動與虹膜特徵...</p>
                <h2 id="boot-main-text" class="boot-title">身分識別中...</h2>
                <div class="boot-progress-track">
                    <div id="boot-progress-bar" class="boot-progress-fill"></div>
                </div>
            </div>

            <button id="skip-boot-btn" class="skip-btn" onclick="document.getElementById('boot-screen').classList.add('fade-out')">跳過驗證直接進入主控台 ⟫</button>
        </div>
    </div>

    <!-- 背景緩慢旋轉星軌 SVG -->
    <div class="celestial-bg">
        <svg viewBox="0 0 1000 1000" fill="none" xmlns="http://w3.org">
            <g class="orbit-slow">
                <circle cx="500" cy="500" r="450" stroke="#e6c27a" stroke-width="1.2" stroke-dasharray="8 8"/>
                <circle cx="500" cy="500" r="360" stroke="#e6c27a" stroke-width="1.8"/>
                <circle cx="500" cy="500" r="240" stroke="#e6c27a" stroke-width="1.2" stroke-dasharray="4 12"/>
                <polygon points="500,50 933,750 67,750" stroke="#e6c27a" stroke-width="1" fill="none"/>
                <polygon points="500,950 933,250 67,250" stroke="#e6c27a" stroke-width="1" fill="none"/>
            </g>
        </svg>
    </div>

    <!-- 頂部系統狀態列 -->
    <div class="system-top-bar">
        <span class="sys-status">SYSTEM 009: ONLINE // 宿主神經已連結</span>
        <span class="sys-warning">[警告] 位面融合進度：持續侵蝕中</span>
    </div>

    <!-- ================= 階段二：獨立系統主控台（HUB 介面） ================= -->
    <section id="system-hub" class="hub-view">
        <div class="hub-wrapper">
            
            <!-- 系統主控台標頭 -->
            <div class="hub-header">
                <span class="hub-tag">PLANAR OS // TERMINAL 009</span>
                <h1>位面系統 009 觀測中樞</h1>
                <p>歡迎回來，高危觀測者。請選擇要調閱的神明終端序列：</p>
            </div>

            <!-- 液態玻璃生理監測區：動態心電圖 -->
            <div class="ecg-glass-box liquid-glass">
                <div class="ecg-top-info">
                    <span class="ecg-label">● NEURAL & SOUL PULSE // 宿主靈魂心電監測</span>
                    <span class="ecg-bpm">SYNC: <strong>98.4%</strong> ｜ 招魔波動：<strong>HIGH</strong></span>
                </div>
                
                <div class="ecg-monitor">
                    <svg viewBox="0 0 600 110" preserveAspectRatio="none" class="ecg-svg">
                        <g stroke="rgba(230, 194, 122, 0.14)" stroke-width="1">
                            <line x1="0" y1="27" x2="600" y2="27" />
                            <line x1="0" y1="55" x2="600" y2="55" />
                            <line x1="0" y1="83" x2="600" y2="83" />
                            <line x1="150" y1="0" x2="150" y2="110" />
                            <line x1="300" y1="0" x2="300" y2="110" />
                            <line x1="450" y1="0" x2="450" y2="110" />
                        </g>
                        <path class="ecg-wave-glow" fill="none" d="M0,55 L70,55 L82,45 L92,55 L110,55 L118,22 L128,92 L138,12 L148,72 L156,55 L180,55 L195,40 L210,55 L290,55 L302,45 L312,55 L330,55 L338,22 L348,92 L358,12 L368,72 L376,55 L400,55 L415,40 L430,55 L510,55 L522,45 L532,55 L550,55 L558,22 L568,92 L578,12 L588,72 L600,55" />
                        <path class="ecg-wave-line" fill="none" d="M0,55 L70,55 L82,45 L92,55 L110,55 L118,22 L128,92 L138,12 L148,72 L156,55 L180,55 L195,40 L210,55 L290,55 L302,45 L312,55 L330,55 L338,22 L348,92 L358,12 L368,72 L376,55 L400,55 L415,40 L430,55 L510,55 L522,45 L532,55 L550,55 L558,22 L568,92 L578,12 L588,72 L600,55" />
                    </svg>
                </div>

                <div class="ecg-bottom-meta">
                    <span>SUBJECTS: 魚期灩 [洗洗睡] / 莫鬱 [一醉解千愁]</span>
                    <span>STATUS: 精神防禦穩定</span>
                </div>
            </div>

            <!-- 六大選單按鈕（純線條與幾何圖案區分，無厚重方框） -->
            <div class="geo-menu-grid">
                
                <!-- 01. 加密檔案 -->
                <button class="geo-btn encrypted" data-open-page="page-01">
                    <div class="geo-icon">
                        <svg viewBox="0 0 60 60">
                            <polygon points="30,4 56,30 30,56 4,30" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <circle cx="30" cy="30" r="14" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/>
                            <rect x="24" y="27" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                            <path d="M26,27 V23 A4,4 0 0,1 34,23 V27" fill="none" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </div>
                    <span class="geo-num">01 // CLASSIFIED</span>
                    <span class="geo-title">加密檔案</span>
                    <span class="geo-sub">位面崩塌與神明法則</span>
                </button>

                <!-- 02. 雙主角檔案 -->
                <button class="geo-btn" data-open-page="page-02">
                    <div class="geo-icon">
                        <svg viewBox="0 0 60 60">
                            <circle cx="24" cy="30" r="15" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <circle cx="36" cy="30" r="15" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <line x1="30" y1="8" x2="30" y2="52" stroke="currentColor" stroke-width="0.9" stroke-dasharray="2 3"/>
                        </svg>
                    </div>
                    <span class="geo-num">02 // SUBJECTS</span>
                    <span class="geo-title">雙主角檔案</span>
                    <span class="geo-sub">高危誘餌組三重身份</span>
                </button>

                <!-- 03. 系統聊天公屏 -->
                <button class="geo-btn" data-open-page="page-03">
                    <div class="geo-icon">
                        <svg viewBox="0 0 60 60">
                            <circle cx="30" cy="30" r="22" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <ellipse cx="30" cy="30" rx="22" ry="9" fill="none" stroke="currentColor" stroke-width="1"/>
                            <ellipse cx="30" cy="30" rx="9" ry="22" fill="none" stroke="currentColor" stroke-width="1"/>
                        </svg>
                    </div>
                    <span class="geo-num">03 // GLOBAL_CHAT</span>
                    <span class="geo-title">系統聊天公屏</span>
                    <span class="geo-sub">全服情報與吃瓜頻道</span>
                </button>

                <!-- 04. 異界怪物圖鑑 -->
                <button class="geo-btn" data-open-page="page-04">
                    <div class="geo-icon">
                        <svg viewBox="0 0 60 60">
                            <polygon points="30,6 54,48 6,48" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <polygon points="30,54 54,12 6,12" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.7"/>
                            <circle cx="30" cy="30" r="4" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="geo-num">04 // ENTITIES</span>
                    <span class="geo-title">異界怪物圖鑑</span>
                    <span class="geo-sub">墮體與逸怪威脅分級</span>
                </button>

                <!-- 05. 天道之子名單 -->
                <button class="geo-btn" data-open-page="page-05">
                    <div class="geo-icon">
                        <svg viewBox="0 0 60 60">
                            <circle cx="30" cy="30" r="18" fill="none" stroke="currentColor" stroke-width="1.2"/>
                            <line x1="30" y1="2" x2="30" y2="58" stroke="currentColor" stroke-width="1"/>
                            <line x1="2" y1="30" x2="58" y2="30" stroke="currentColor" stroke-width="1"/>
                            <circle cx="30" cy="30" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/>
                        </svg>
                    </div>
                    <span class="geo-num">05 // CHOSEN_ONE</span>
