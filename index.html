<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【位面系統009】高維觀測終端</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <div id="boot-screen" class="boot-overlay">
        <div class="boot-glass-panel">
            <div class="boot-code">SYSTEM_ID // 009-OMEGA</div>
            <div class="iris-scanner">
                <svg viewBox="0 0 200 200" class="iris-svg">
                    <circle cx="100" cy="100" r="88" class="iris-ring-outer" />
                    <circle cx="100" cy="100" r="68" class="iris-ring-mid" />
                    <circle cx="100" cy="100" r="46" class="iris-ring-inner" />
                    <circle cx="100" cy="100" r="18" class="iris-pupil" />
                    <line x1="100" y1="4" x2="100" y2="22" class="iris-cross" />
                    <line x1="100" y1="178" x2="100" y2="196" class="iris-cross" />
                    <line x1="4" y1="100" x2="22" y2="100" class="iris-cross" />
                    <line x1="178" y1="100" x2="196" y2="100" class="iris-cross" />
                </svg>
                <div class="scan-laser"></div>
            </div>
            <div class="boot-status-box">
                <p id="boot-sub-text" class="boot-sub">正在擷取靈魂波動與虹膜特徵...</p>
                <h2 id="boot-main-text" class="boot-title">身分識別中...</h2>
                <div class="boot-progress-track">
                    <div id="boot-progress-bar" class="boot-progress-fill"></div>
                </div>
            </div>
            <button id="skip-boot-btn" class="skip-btn">跳過驗證直接進入主控台 ⟫</button>
        </div>
    </div>

    <div class="celestial-bg">
        <svg viewBox="0 0 1000 1000" fill="none">
            <g class="orbit-slow">
                <circle cx="500" cy="500" r="450" stroke="#e6c27a" stroke-width="1.2" stroke-dasharray="8 8"/>
                <circle cx="500" cy="500" r="360" stroke="#e6c27a" stroke-width="1.8"/>
                <circle cx="500" cy="500" r="240" stroke="#e6c27a" stroke-width="1.2" stroke-dasharray="4 12"/>
                <polygon points="500,50 933,750 67,750" stroke="#e6c27a" stroke-width="1" fill="none"/>
                <polygon points="500,950 933,250 67,250" stroke="#e6c27a" stroke-width="1" fill="none"/>
            </g>
        </svg>
    </div>

    <div class="system-top-bar">
        <span class="sys-status">SYSTEM 009: ONLINE // 宿主神經已連結</span>
        <span class="sys-warning">[警告] 位面融合進度：持續侵蝕中</span>
    </div>

    <section id="system-hub" class="hub-view">
        <div class="hub-wrapper">
            <div class="hub-header">
                <span class="hub-tag">PLANAR OS // TERMINAL 009</span>
                <h1>位面系統 009 觀測中樞</h1>
                <p>歡迎回來，高危觀測者。請選擇要調閱的神明終端序列：</p>
            </div>
            <div id="biometric-mount" class="biometric-stack"></div>
            <div id="geo-menu-mount" class="geo-menu-grid"></div>
        </div>
    </section>

    <main id="detail-workspace" class="container hidden">
        <div class="subpage-topbar">
            <button id="back-to-hub-btn" class="back-hub-btn">⟪ 返回系統 009 主控台</button>
            <span id="subpage-path" class="subpage-path">TERMINAL 009 // DATA_STREAM</span>
        </div>
        <div id="subpage-content"></div>
    </main>

    <footer>
        PLANAR SYSTEM 009 // 僅供內部檔案查閱與共創紀錄使用
    </footer>

    <script src="script.js?v=6"></script>
</body>
</html>
